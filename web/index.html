<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="原神角色基础资料与可追溯出处。剧情检索和人物关系功能使用原创合成样本。">
    <title>原神文本档案 · 本地原型</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#/real-characters" aria-label="原神文本档案首页">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span><strong>原神文本档案</strong><small>THE TEXT ARCHIVE</small></span>
      </a>
      <div class="sidebar-label">探索档案 <span>EXPLORE</span></div>
      <nav class="primary-nav">
        <a href="#/search" data-page="search" aria-label="文本检索"><span class="nav-icon" aria-hidden="true">⌕</span><span>文本检索</span><small>01</small></a>
        <a href="#/read" data-page="read" aria-label="原文阅读"><span class="nav-icon" aria-hidden="true">▤</span><span>原文阅读</span><small>02</small></a>
        <a href="#/graph" data-page="graph" aria-label="人物关系图"><span class="nav-icon" aria-hidden="true">◇</span><span>人物关系图</span><small>03</small></a>
        <a href="#/real-characters" data-page="real-characters" aria-label="真实角色目录"><span class="nav-icon" aria-hidden="true">♧</span><span>真实角色</span><small>04</small></a>
        <a href="#/materials" data-page="materials" aria-label="素材清单"><span class="nav-icon" aria-hidden="true">▣</span><span>素材清单</span><small>05</small></a>
        <a href="#/about" data-page="about" aria-label="收录与纠错"><span class="nav-icon" aria-hidden="true">✎</span><span>收录纠错</span><small>06</small></a>
      </nav>
      <div class="sidebar-note">
        <span class="eyebrow">从文本，到关系</span>
        <p>让每一次解读，<br>都能回到原文。</p>
        <div class="note-line"></div>
        <span class="small muted">首批真实角色基础资料已接入<br>剧情与关系仍为原创样本</span>
      </div>
      <div class="sidebar-footer"><span class="status-dot"></span><span>本地原型</span><code>v0.1</code></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumbs"><span>资料库</span><span aria-hidden="true">/</span><strong id="page-name">文本检索</strong></div>
        <div class="global-controls">
          <label><span>内容范围</span><select id="scope-select" aria-label="内容范围">
            <option value="opening">仅开篇 · 无后续</option>
            <option value="east">开篇 + 东路分支</option>
            <option value="west">开篇 + 西路分支</option>
            <option value="all">全部样本 · 含后续</option>
          </select></label>
          <label><span>使用用途</span><select id="purpose-select" aria-label="使用用途">
            <option value="display">网站阅读</option>
            <option value="export">素材导出</option>
            <option value="external_ai">AI 取材</option>
          </select></label>
        </div>
      </header>
      <div class="prototype-notice"><span aria-hidden="true">◇</span><strong>原创样本演示</strong><span>全部人物、对白与关系均为虚构测试内容，不是原神剧情。</span></div>
      <div class="archive-status"><span id="archive-snapshot" role="status">正在读取本地 SQLite 档案…</span><button id="open-active" class="text-button">读取当前发布快照 ↻</button></div>
      <main id="main" tabindex="-1"><div class="loading-state" role="status">正在打开档案…</div></main>
      <footer class="page-footer"><span>原神文本档案 · 非官方网站</span><span>有出处的阅读，有边界的探索。</span></footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><div class="noscript">此交互原型需要启用 JavaScript。运行方式见项目 README。</div></noscript>
  </body>
</html>
